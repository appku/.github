name: "☰ New Story"
description: "Add a new product story to this project."
title: "Story: TBD"
labels: "✎ draft, ☰ story"
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > The **title** of this issue will be processed by the AppKu AI. You may include a brief title to help guide the AI or leave it as-is.
        
        # :gear: Welcome!
        This form is filled out to add a new formal Behavior to the project Plan.
  - type: textarea
    id: result
    attributes:
      label: What
      description: What is the Result of the Actor(s) performing the Action?
      value: |
        *Does this product have or affect a background process?*
        _What task(s) or decision(s) does it represent? What do they do- in detail?_
        *Does this product have or affect a frontend user interface?*
        _What are the representing wireframe(s) or doodle(s)?_
    validations:
      required: true
