name: "\U0000203B New Feedback Task"
description: "Feedback from the team or the customer, including QA."
title: "[A new feedback task...]"
labels: 
  - "✎ triage"
  - "※ feedback"
assignees: []
body:
  - type: checkboxes
    id: environments
    attributes:
      label: Environments Observed
      options:
        - label: '`production`'
        - label: '`review`'
        - label: '`staging`'
  - type: textarea
    id: task
    attributes:
      label: Description
      description: |
        **_What is the feedback?_**
      value: |
        _Replace me with details, use a task list (below) if desired..._
        
        - [ ] Todo 1
        - [ ] Todo 2
        - [ ] Todo 3
    validations:
      required: true
  - type: textarea
    id: materials
    attributes:
      label: Relevant Materials & Information
      description: |
        **_Any context, samples, links, or references?_**
      value: |
        _None_
