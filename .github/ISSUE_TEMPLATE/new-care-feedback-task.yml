name: "\U00002661 New Care Feedback Task"
description: "A Care ticket related feedback task from a customer."
title: "[A new care feedback task...]"
labels: 
  - "✎ triage"
  - "♡ care"
  - "※ feedback"
assignees: []
body:
  - type: input
    id: ticket
    attributes:
      label: 'Ticket # or URL'
    validations:
      required: true
  - type: checkboxes
    id: environments
    attributes:
      label: Environments Observed
      options:
        - label: `production`
        - label: `review`
        - label: `staging`
  - type: textarea
    id: task
    attributes:
      label: Description
      description: |
        **_What is the feedback?_**
      value: |
        _Replace me with details, use a task list (below) if desired..._
        
        - [ ] Todo 1
        - [ ] Todo 2
        - [ ] Todo 3
    validations:
      required: true
  - type: textarea
    id: 
    attributes:
      label: Relevant Materials & Information
      description: |
        **_Any context, samples, links, or references?_**
      value: |
        _None_
