name: "⚙ New Behavior"
description: "Add a new behavior to this project."
title: "[Actor]: [Action]"
labels: "triage, ⚙ behavior"
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **We recommend letting the AppKu™ team fill out this form for you.**
        >
        > As part of *our service to you*, we'll draft, design, and prepare Behaviors and their definitions.
        > 
        > You may be looking to create a new :bulb: Idea instead! [Click here and choose "🞻 New Idea"](./new/choose).*
        > *or*
        > Need help with something else? [Click here and choose "♡ Care Request - Help/Support/Questions"](./new/choose).*

        > [!IMPORTANT]
        > The **title** of this issue must follow the format of: `[Actor]: [Action]`
        >
        > Where `[Actor]` is the *type of user* (role) that can perform the action and get the result. 
        > Where `[Action]` is the *description of the action the Actor(s) take in order to get a result*.
        
        # :gear: Welcome!
        This form is filled out to add a new formal Behavior to the project Plan.    
  - type: input
    id: actor
    attributes:
      label: What type of user(s) will perform the action?
      description: What types of users (Administrators, readers, etc.) would be able to perform the actions described?
      value: 
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: What is the action they will perform?
      options:
        - Activates
        - Clicks
        - Drags
        - Drops
        - Focuses
        - Gestures
        - Grabs
        - Hovers
        - Loads
        - Pinches
        - Presses
        - Resizes
        - Scrolls
        - Swipes
        - Toggles
        - Triggers
        - Types
        - Unfocuses
        - Unloads
    validations:
      required: true
  - type: input
    id: action-subject
    attributes:
      label: What is target and description of the action?
      value: 
  - type: textarea
    id: result
    attributes:
      label: What is the Result of the Actor's Action?
      description: "Describe the Result of the Actor(s) performing the Action:"
      placeholder: The...
      value: 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Context
      description: Is there any addition context that should be included about this behavior?
      placeholder: Calculations, samples, considerations, data sources, etc.
      value:
